name: Frontend CI

on:
  push:
    branches: [ "master", "develop" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./frontend

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Check formatting (Prettier)
      run: npx prettier --check .
      continue-on-error: true

    # Le tube `| head -100` masquait le code de sortie d'ESLint (le statut d'un
    # pipeline est celui de sa derniere commande, donc toujours 0). Retire le
    # 26/08/2026 pour que les erreurs remontent reellement.
    # `continue-on-error` reste actif le temps de resorber la dette de lint
    # existante ; a retirer ensuite, en alignant next.config.mjs
    # (eslint.ignoreDuringBuilds -> false). Voir le lot 0.1 du plan
    # docs/PLAN_ACTION_MISE_A_NIVEAU_WEB_2026-08-26.md
    - name: Run Linter (ESLint)
      run: npm run lint
      continue-on-error: true

    # BLOQUANT — le typecheck strict doit passer (gate de merge)
    - name: Type checking (TypeScript)
      run: npm run typecheck

    - name: Build Next.js application
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_API_TIMEOUT: 5000

    # BLOQUANT — integrite de l arborescence (lot 0.4, projet `routage`).
    # N utilise que la fixture `request` de Playwright : aucun binaire de
    # navigateur a telecharger, aucun backend requis. Protege les 11
    # redirections et les 11 destinations du renommage du lot 0.2, et interdit
    # qu une route de page francisee fuite dans un chemin /api/.
    #
    # Voir docs/PLAN_ACTION_MISE_A_NIVEAU_WEB_2026-08-26.md
    - name: Route integrity tests (Playwright, sans navigateur)
      run: npm run test:routage
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_API_TIMEOUT: 5000

    # Decision 5 du plan, tranchee voie A le 26/08 : le binaire Chromium est
    # installe en CI pour rendre les 3 parcours critiques executables. C est la
    # seule parade au risque du lot 4 (decoupage de jobs/[id]/page.tsx, 1 470
    # lignes et 12 gestionnaires d API).
    #
    # Mis en cache sur la version de Playwright pour eviter un telechargement a
    # chaque execution : la cle change quand package-lock.json change.
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

    - name: Install Playwright Chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium

    # Les dependances systeme sont necessaires meme quand le binaire vient du
    # cache : elles ne sont pas dans ~/.cache/ms-playwright.
    - name: Install Playwright system deps (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    # BLOQUANT — garde-fou des data-testid dont dependent les parcours. Exige un
    # navigateur (les ecrans concernes sont des composants client qui ne rendent
    # rien cote serveur) mais aucun backend. Sans lui, la disparition d un
    # selecteur lors d un refactor se manifesterait plus tard comme un faux
    # echec fonctionnel dans les parcours - le pire des diagnostics.
    - name: Selector guard tests (Playwright, Chromium)
      run: npm run test:selecteurs
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_API_TIMEOUT: 5000

    # NON BLOQUANT pour l instant : les parcours s auto-ignorent sans backend
    # joignable, et les ecrans a creer sont marques `fixme`. A rendre bloquant
    # quand le lot 1 livre ses ecrans et qu un backend de recette est dispo.
    - name: Critical journey tests (Playwright, Chromium)
      run: npm run test:parcours
      continue-on-error: true
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_API_TIMEOUT: 5000

    - name: Check bundle size
      if: success()
      run: |
        echo "## 📦 Build Output" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        du -sh .next/ 2>/dev/null || echo "Build folder not found"
        echo '```' >> $GITHUB_STEP_SUMMARY
        # List page sizes
        if [ -d ".next/server/app" ]; then
          echo "### Page Sizes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find .next/server/app -name "*.html" -exec du -h {} \; | sort -rh | head -20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: Build Summary
      if: always()
      run: |
        echo "## 🚀 Frontend CI Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Node: ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
        echo "- Next.js build: ${{ job.status == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
